version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
      time: "08:00"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: pip
    directories: ["/", "/addons/torch_c_dlpack_ext", "/addons/tvm_ffi_orcjit"]
    schedule:
      interval: weekly
      time: "08:00"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: cargo
    directories: ["/rust"]
    schedule:
      interval: weekly
      time: "08:00"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
  - package-ecosystem: gitsubmodule
    directories: ["/"]
    schedule:
      interval: weekly
      time: "08:00"
    cooldown:
      default-days: 7
    groups:
      submodules: {}
