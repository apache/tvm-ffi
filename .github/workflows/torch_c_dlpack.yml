name: Torch DLPack compatibility wheel
on:
  push:
    paths: ["addons/torch_c_dlpack_ext/**", ".github/workflows/torch_c_dlpack.yml"]
  pull_request:
    paths: ["addons/torch_c_dlpack_ext/**", ".github/workflows/torch_c_dlpack.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15t"
          activate-environment: true
      - name: Resolve current stable dependencies
        working-directory: addons/torch_c_dlpack_ext
        run: uv sync --no-default-groups --group build --group test --upgrade --no-install-project
      - name: Build and test universal wheel
        working-directory: addons/torch_c_dlpack_ext
        run: |
          uv run --no-sync python -m build
          uv run --no-sync twine check dist/*
          uv pip install --python .venv/bin/python dist/*.whl
          uv run --no-sync python -m pytest -o addopts="" tests -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torch-dlpack
          path: addons/torch_c_dlpack_ext/dist/*
  upload_pypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torch-dlpack
          path: dist
      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
