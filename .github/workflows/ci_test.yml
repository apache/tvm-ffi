name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # dev branch is used for testing purposes
      - dev

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      should_skip_ci_commit: ${{ steps.detect.outputs.should_skip_ci_commit }}
      should_skip_ci_docs_only: ${{ steps.detect.outputs.should_skip_ci_docs_only }}
      cpp_changed: ${{ steps.cpp_files.outputs.changed }}
      cpp_files: ${{ steps.cpp_files.outputs.files }}
      orcjit_changed: ${{ steps.orcjit_files.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Detect skip ci and docs changes
        id: detect
        uses: $/.github/actions/detect-skip-ci
        with:
          github_event_name: ${{ github.event_name }}
          pr_base_ref: ${{ github.event.pull_request.base.ref || '' }}
          pr_head_sha: ${{ github.event.pull_request.head.sha || '' }}
      - name: Get changed C++ files
        id: cpp_files
        run: |
          BASE_REF=${CI_GITHUB_BASE_REF:+origin/$CI_GITHUB_BASE_REF}
          BASE_REF=${BASE_REF:-HEAD^}
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD -- \
            src/ tests/ | { grep -E '\.(c|cc|cpp|cxx)$' || true; } | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          [ -n "$FILES" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
        env:
          CI_GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Get changed OrcJIT files
        id: orcjit_files
        run: |
          BASE_REF=${CI_GITHUB_BASE_REF:+origin/$CI_GITHUB_BASE_REF}
          BASE_REF=${BASE_REF:-HEAD^}
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD -- \
            addons/tvm_ffi_orcjit/ .github/actions/build-orcjit-wheel/ | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          [ -n "$FILES" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

        env:
          CI_GITHUB_BASE_REF: ${{ github.base_ref }}
  lint:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python environment
        run: uv sync --group dev --no-install-project
      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --show-diff-on-failure --color=always --all-files

  clang-tidy:
    needs: [prepare]
    if: needs.prepare.outputs.cpp_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.13
      - uses: $/.github/actions/detect-env-vars
        id: env_vars
      - name: Run clang-tidy
        run: |
          read -r -a cpp_files <<< "$CI_NEEDS_PREPARE_OUTPUTS_CPP_FILES"
          uv run --no-project --with "clang-tidy"     \
            python tests/lint/clang_tidy_precommit.py         \
              --build-dir=build-pre-commit                    \
              --jobs="${CI_STEPS_ENV_VARS_OUTPUTS_CPU_COUNT}"  \
              "${cpp_files[@]}"

        env:
          CI_NEEDS_PREPARE_OUTPUTS_CPP_FILES: ${{ needs.prepare.outputs.cpp_files }}
          CI_STEPS_ENV_VARS_OUTPUTS_CPU_COUNT: ${{ steps.env_vars.outputs.cpu_count }}
  doc:
    needs: [lint, prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.13
      - name: Generate docs
        run: |
          sudo apt install doxygen
          BUILD_CPP_DOCS=1 uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    needs: [lint, prepare]
    if: >
      needs.prepare.outputs.should_skip_ci_commit != 'true' &&
      needs.prepare.outputs.should_skip_ci_docs_only != 'true'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64, python_version: '3.14t'}
          - {os: ubuntu-latest, arch: x86_64, python_version: '3.15t'}
          - {os: ubuntu-24.04-arm, arch: aarch64, python_version: '3.14'}
          - {os: windows-latest, arch: AMD64, python_version: '3.11'}
          - {os: macos-14, arch: arm64, python_version: '3.13'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Print current commit
        run: git log -1 --oneline

      # Detect CPU count
      - uses: $/.github/actions/detect-env-vars
        id: env_vars
      - name: Print CPU count
        run: |
          echo "CPU count: ${CI_STEPS_ENV_VARS_OUTPUTS_CPU_COUNT}"

      # Run C++ tests
        env:
          CI_STEPS_ENV_VARS_OUTPUTS_CPU_COUNT: ${{ steps.env_vars.outputs.cpu_count }}
      - name: Run cpp tests
        if: ${{ matrix.os != 'windows-latest' }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: |
          cmake . -B build_test -DTVM_FFI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_test --clean-first --config Debug --target tvm_ffi_tests
          ctest -V -C Debug --test-dir build_test --output-on-failure
      - name: Run cpp tests[windows]
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: >
          cmake . -B build_test -DTVM_FFI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug &&
          cmake --build build_test --clean-first --config Debug --target tvm_ffi_tests &&
          ctest -V -C Debug --test-dir build_test --output-on-failure

      - name: Locate and Set VsDevCmd Path [windows]
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          # Captures the output (path) from your Python script
          $vsPath = python .github/workflows/utils/locate_vsdevcmd_bat.py

          # Sets an environment variable for all subsequent steps in this job
          "VS_DEV_CMD_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Run Python tests
      - name: Setup Python ${{ matrix.python_version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python_version }}
          activate-environment: true
      - name: Build and install python package
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: |
          uv sync --no-default-groups --group test --upgrade
      - name: Run python tests
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          pytest -vvs tests/python
      - name: Run python tests [windows]
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          & (Join-Path (Split-Path $env:VS_DEV_CMD_PATH) "Launch-VsDevShell.ps1") `
            -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          pytest -vvs tests/python

      # Run Rust tests, must happen after installing the pip package.
      - name: Run rust tests
        working-directory: rust
        run: |
          cargo test

      # Build the Rust stubgen example against the installed package. Its post-build
      # step refreshes the bindings in place, so a diff means the checked-in file was stale.
      - name: Run rust stubgen example
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: examples/rust_stubgen
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          git diff --exit-code -- rust/src/generated
          cd rust && cargo run

  # Build + test the orcjit wheel. On Linux the action downloads a prebuilt LLVM
  # tarball from a GitHub Release (built from source under the manylinux
  # gcc-toolset so the ABI stays under the floor); macOS/Windows install LLVM via
  # conda inside the action. The LLVM release is produced out-of-band (rarely, on
  # version bump) by mlc-ai/package's build_llvm workflow -- not on every CI run.
  orcjit:
    needs: [lint, prepare]
    if: >
      needs.prepare.outputs.orcjit_changed == 'true' &&
      needs.prepare.outputs.should_skip_ci_commit != 'true' &&
      needs.prepare.outputs.should_skip_ci_docs_only != 'true'
    name: orcjit ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: "23.1.1"
      # Repo hosting the prebuilt LLVM release assets consumed on Linux. Built
      # out-of-band from source in a manylinux image so the ABI stays under the
      # manylinux_2_28 floor; see that repo's build_llvm workflow.
      LLVM_RELEASE_REPO: "mlc-ai/package"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64, build: "cp312-manylinux_x86_64"}
          - {os: ubuntu-24.04-arm, arch: aarch64, build: "cp312-manylinux_aarch64"}
          - {os: macos-14, arch: arm64, build: "cp312-macosx_arm64"}
          - {os: windows-latest, arch: AMD64, build: "cp312-win_amd64"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build OrcJIT wheel
        uses: $/.github/actions/build-orcjit-wheel
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}
          checkout_ref: ${{ github.sha }}
          llvm_version: ${{ env.LLVM_VERSION }}
          llvm_release_repo: ${{ env.LLVM_RELEASE_REPO }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-orcjit-wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
