name: Publish OrcJIT wheel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (manual run)"
        required: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64, build: "cp{312,314t,315t}-manylinux_x86_64"}
          - {os: ubuntu-24.04-arm, arch: aarch64, build: "cp{312,314t,315t}-manylinux_aarch64"}
          - {os: macos-14, arch: arm64, build: "cp{312,314t,315t}-macosx_arm64"}
          - {os: macos-15-intel, arch: x86_64, build: "cp{312,314t,315t}-macosx_x86_64"}
          - {os: windows-latest, arch: AMD64, build: "cp{312,314t,315t}-win_amd64"}

    steps:
      - name: Checkout repository (for local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build OrcJIT wheel
        uses: $/.github/actions/build-orcjit-wheel
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}
          checkout_ref: ${{ inputs.tag }}

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-orcjit-wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-orcjit-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation for wheels
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          verbose: true
