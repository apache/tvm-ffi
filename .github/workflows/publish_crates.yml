name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (manual run, e.g. v0.1.15 or v0.1.15-rc0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify crates without publishing to crates.io"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build_crates:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the OS/architecture matrix in sync with publish_wheel.yml.
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: windows-latest, arch: AMD64}
          - {os: macos-14, arch: arm64}

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true

      # Workspace publishing and dry-runs require Cargo 1.90 or newer.
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - uses: ./.github/actions/detect-env-vars
        id: env_vars

      # tvm-ffi-sys locates libtvm_ffi through tvm-ffi-config on PATH.
      - name: Build and install TVM FFI
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: uv pip install --verbose .

      # Apply the release version after the Python build so setuptools-scm sees a clean tree.
      - name: Set crate versions from Git
        shell: bash
        run: &set_crate_versions |
          uv run --no-project --with tomlkit python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          import tomlkit

          tag = subprocess.check_output(
              ["git", "describe", "--tags", "--exact-match", "--match", os.environ["RELEASE_TAG"]],
              text=True,
          ).strip()
          version = tag.removeprefix("v")
          # Normalize the repository's RC tags to numeric SemVer prerelease identifiers.
          version = re.sub(r"-(alpha|beta|rc)(\d+)$", r"-\1.\2", version)
          crates = ("tvm-ffi", "tvm-ffi-sys", "tvm-ffi-macros")
          for crate in crates:
              path = Path("rust") / crate / "Cargo.toml"
              manifest = tomlkit.parse(path.read_text(encoding="utf-8"))
              manifest["package"]["version"] = version
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for name, dependency in manifest.get(section, {}).items():
                      if name in crates:
                          dependency["version"] = version
              path.write_text(tomlkit.dumps(manifest), encoding="utf-8")
              print(f"{crate}: {version}")
          PY
          # Cargo validates the derived SemVer and the updated dependency requirements.
          cargo +stable metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Build crates
        working-directory: rust
        run: cargo +stable build --release --workspace

      - name: Test crates
        working-directory: rust
        run: cargo +stable test --release --workspace

      - name: Package and verify crates
        working-directory: rust
        # Only the release-version edits above are uncommitted in this checkout.
        run: cargo +stable package --workspace --registry crates-io --allow-dirty

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crates-${{ matrix.os }}-${{ matrix.arch }}
          path: rust/target/package/*.crate
          if-no-files-found: error

      - name: Dry-run crate publication
        if: inputs.dry_run
        working-directory: rust
        run: cargo +stable publish --dry-run --workspace --registry crates-io --allow-dirty

  upload_crates:
    needs: [build_crates]
    runs-on: ubuntu-latest
    environment: crates-io
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - uses: ./.github/actions/detect-env-vars
        id: env_vars

      - name: Build and install TVM FFI
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: uv pip install --verbose .

      - name: Set crate versions from Git
        shell: bash
        run: *set_crate_versions

      # Cargo publishes the workspace in dependency order and waits for the registry index.
      # Configure a crates.io API token with publish access to all three crates.
      - name: Publish crates to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --workspace --registry crates-io --allow-dirty
