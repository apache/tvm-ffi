name: Build OrcJIT Wheel
description: >
  Build and test OrcJIT wheels for a given OS/architecture combination.
  Installs the LLVM static SDK from PyPI and runs cibuildwheel.

inputs:
  arch:
    description: "Target architecture (e.g., x86_64, aarch64, arm64, AMD64, ARM64)"
    required: true
  build:
    description: "cibuildwheel build selector (e.g., cp312-manylinux_x86_64)"
    required: true
  checkout_ref:
    description: "Branch, tag, or SHA to check out before building"
    required: true
  llvm_version:
    description: "mlc-llvm-static version (keep in sync with the addon build requirements)"
    default: "23.1.1.post0"
    required: false

runs:
  using: "composite"
  steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.checkout_ref }}
        submodules: recursive

    - uses: ./.github/actions/detect-env-vars
      id: env_vars

    - name: Activate native ARM64 Visual Studio tools
      if: runner.os == 'Windows' && inputs.arch == 'ARM64'
      shell: pwsh
      run: |
        $vsDevCmd = python .github/workflows/utils/locate_vsdevcmd_bat.py
        $devEnv = cmd /c "`"$vsDevCmd`" -arch=arm64 -host_arch=arm64 >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "Failed to activate ARM64 Visual Studio tools" }
        foreach ($line in $devEnv) {
          if ($line -match '^([^=]+)=(.*)$') {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
        }

    # ---- Build and test wheels ----
    - name: Build and test wheels
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1
      with:
        package-dir: addons/tvm_ffi_orcjit
        output-dir: wheelhouse
      env:
        CIBW_BUILD: ${{ inputs.build }}
        CIBW_ARCHS_LINUX: ${{ inputs.arch }}
        CIBW_ARCHS_MACOS: ${{ inputs.arch }}
        CIBW_ARCHS_WINDOWS: ${{ inputs.arch }}
        # The PyPI SDK is built for the manylinux_2_28 ABI floor.
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        # Match the deployment floor of the macOS SDK wheel.
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=14.0
        CIBW_BUILD_VERBOSITY: 1
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        # Build against the in-tree core (not PyPI) so the addon's tvm_ffi ABI
        # matches the core the tests reinstall; a mismatch segfaults the JIT.
        CIBW_BEFORE_BUILD: >-
          pip install "scikit-build-core>=0.10.0" cmake ninja
          "mlc-llvm-static==${{ inputs.llvm_version }}" "{project}"
        CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
        # The SDK contains libraries and headers; compilers remain separate test tools.
        CIBW_BEFORE_ALL_LINUX: dnf install -y clang
        # The SDK supplies liborc_rt for the custom-runtime tests; it is not a runtime dependency.
        CIBW_TEST_REQUIRES: pytest pytest-xdist ninja mlc-llvm-static==${{ inputs.llvm_version }}
        CIBW_TEST_COMMAND: >-
          pip install --force-reinstall {project} &&
          pytest {project}/addons/tvm_ffi_orcjit/tests -v &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang cpp &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
        CIBW_TEST_COMMAND_WINDOWS: >-
          pip install --force-reinstall {project} &&
          pytest {project}/addons/tvm_ffi_orcjit/tests -v &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
